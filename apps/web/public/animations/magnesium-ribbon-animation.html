<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magnesium Ribbon Experiment Animation</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #101820;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 28%, rgba(255, 255, 255, 0.18), transparent 0 26rem),
          linear-gradient(135deg, #0f172a, #172033 52%, #0b1120);
      }

      .stage {
        width: min(100vw, 1280px);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #07152d;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      text {
        fill: #f8fbff;
        font-family: Arial, Helvetica, sans-serif;
        letter-spacing: 0;
      }

      .title {
        font-size: 34px;
        font-weight: 900;
      }

      .label {
        font-size: 18px;
        font-weight: 800;
      }

      .small {
        font-size: 15px;
        font-weight: 700;
      }

      .leader {
        fill: none;
        stroke: #dbeafe;
        stroke-width: 2;
        stroke-linecap: round;
      }

      .screen {
        mix-blend-mode: screen;
      }

      .will-animate {
        transform-box: view-box;
        will-change: transform, opacity;
      }

      .no-gsap #moving-tongs {
        animation: fallback-tongs 6.2s ease-in-out infinite;
        transform-origin: 0 0;
      }

      .no-gsap #contact-glow {
        animation: fallback-contact 6.2s ease-in-out infinite;
        transform-origin: 690px 246px;
      }

      .no-gsap #lit-flame {
        animation: fallback-lit-flame 6.2s ease-in-out infinite;
        transform-origin: 0 0;
      }

      .no-gsap #ash-pile {
        animation: fallback-pile 6.2s ease-in-out infinite;
      }

      @keyframes fallback-tongs {
        0%,
        14% {
          transform: translate(910px, 166px) rotate(-4deg);
        }

        32%,
        62%,
        92% {
          transform: translate(690px, 246px) rotate(-3deg);
        }

        100% {
          transform: translate(910px, 166px) rotate(-4deg);
        }
      }

      @keyframes fallback-contact {
        0%,
        28%,
        50%,
        100% {
          opacity: 0;
          transform: scale(0.4);
        }

        34% {
          opacity: 1;
          transform: scale(1.1);
        }
      }

      @keyframes fallback-lit-flame {
        0%,
        28% {
          opacity: 0;
          transform: scale(0.4);
        }

        34%,
        78% {
          opacity: 1;
          transform: scale(1.05);
        }

        92%,
        100% {
          opacity: 0;
          transform: scale(0.7);
        }
      }

      @keyframes fallback-pile {
        0%,
        58%,
        100% {
          opacity: 0;
        }

        72%,
        88% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .no-gsap #moving-tongs,
        .no-gsap #contact-glow,
        .no-gsap #lit-flame,
        .no-gsap #ash-pile {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <svg viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
        <title id="title">Magnesium ribbon experiment sequence</title>
        <desc id="desc">
          Tongs move a magnesium ribbon into a yellow burner flame, the ribbon burns with a dazzling white flame, and
          white magnesium oxide ash forms inside a watch glass.
        </desc>

        <defs>
          <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1">
            <stop stop-color="#06142d" />
            <stop offset="0.62" stop-color="#0b1f43" />
            <stop offset="1" stop-color="#102b52" />
          </linearGradient>

          <linearGradient id="table" x1="0" x2="1" y1="0" y2="0">
            <stop stop-color="#a45b20" />
            <stop offset="0.24" stop-color="#e2a955" />
            <stop offset="0.62" stop-color="#f1c572" />
            <stop offset="1" stop-color="#9b551f" />
          </linearGradient>

          <linearGradient id="burner-metal" x1="0" x2="1" y1="0" y2="0">
            <stop stop-color="#374151" />
            <stop offset="0.18" stop-color="#f8fafc" />
            <stop offset="0.5" stop-color="#a3aeb7" />
            <stop offset="0.78" stop-color="#ffffff" />
            <stop offset="1" stop-color="#475569" />
          </linearGradient>

          <linearGradient id="steel" x1="0" x2="1" y1="0" y2="0">
            <stop stop-color="#f8fafc" />
            <stop offset="0.22" stop-color="#66737b" />
            <stop offset="0.48" stop-color="#e5edf0" />
            <stop offset="0.74" stop-color="#7b8790" />
            <stop offset="1" stop-color="#f8fafc" />
          </linearGradient>

          <linearGradient id="magnesium" x1="0" x2="1" y1="0" y2="0">
            <stop stop-color="#fff8bf" />
            <stop offset="0.42" stop-color="#b6b58c" />
            <stop offset="1" stop-color="#fffde7" />
          </linearGradient>

          <radialGradient id="yellow-glow" cx="50%" cy="50%" r="50%">
            <stop stop-color="#fff7ad" />
            <stop offset="0.35" stop-color="#facc15" stop-opacity="0.8" />
            <stop offset="0.72" stop-color="#fb923c" stop-opacity="0.28" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>

          <radialGradient id="white-glow" cx="50%" cy="50%" r="50%">
            <stop stop-color="#ffffff" />
            <stop offset="0.22" stop-color="#ffffff" />
            <stop offset="0.45" stop-color="#fffde7" />
            <stop offset="0.72" stop-color="#bfdbfe" stop-opacity="0.45" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>

          <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#f8fdff" stop-opacity="0.92" />
            <stop offset="0.55" stop-color="#b7d9e2" stop-opacity="0.62" />
            <stop offset="1" stop-color="#7099a7" stop-opacity="0.82" />
          </linearGradient>

          <filter id="blur" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="12" />
          </filter>

          <filter id="soft-shadow" x="-30%" y="-40%" width="160%" height="180%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.18" />
          </filter>
        </defs>

        <rect width="1280" height="720" fill="url(#wall)" />
        <path d="M0 532 H1280 V720 H0 Z" fill="url(#table)" />
        <path d="M0 576 H1280" stroke="#7c3f16" stroke-width="3" opacity="0.65" />
        <path d="M0 628 H1280" stroke="#7c3f16" stroke-width="2" opacity="0.38" />

        <text class="title" x="42" y="70">Magnesium Ribbon Burning in Air</text>
        <text class="small" x="44" y="100">Heat the ribbon, observe the dazzling white flame, see MgO white ash form in the bowl.</text>

        <g id="equation-panel" transform="translate(44 132)">
          <rect width="336" height="100" rx="10" fill="#10294f" stroke="#60a5fa" stroke-width="2" opacity="0.92" />
          <text x="24" y="34" class="label">Chemical reaction</text>
          <text x="24" y="73" font-size="27" font-weight="800">2Mg + O2 -> 2MgO</text>
        </g>

        <g id="burner" filter="url(#soft-shadow)">
          <ellipse cx="466" cy="548" rx="72" ry="22" fill="#1267b3" stroke="#0f3766" stroke-width="4" />
          <path d="M405 548 C430 580 504 580 529 548 Z" fill="#1d7ed0" stroke="#0f3766" stroke-width="4" />
          <path d="M438 450 H494 V548 H438 Z" fill="#be7b22" stroke="#172554" stroke-width="4" />
          <path d="M486 451 C532 412 590 366 642 332" fill="none" stroke="url(#burner-metal)" stroke-width="30" stroke-linecap="round" />
          <path d="M486 451 C532 412 590 366 642 332" fill="none" stroke="#172554" stroke-width="4" stroke-linecap="round" />
          <ellipse cx="650" cy="326" rx="25" ry="9" fill="#64748b" stroke="#172554" stroke-width="3" transform="rotate(-34 650 326)" />
          <rect x="463" y="471" width="14" height="22" fill="#1f2937" stroke="#0f172a" stroke-width="3" />
          <path d="M438 500 C358 500 294 523 220 540" fill="none" stroke="#bf5b16" stroke-width="17" stroke-linecap="round" />
          <path d="M438 500 C358 500 294 523 220 540" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" />
        </g>

        <g id="yellow-burner-flame" class="will-animate screen">
          <ellipse cx="690" cy="288" rx="54" ry="84" fill="url(#yellow-glow)" filter="url(#blur)" opacity="0.82" />
          <path d="M662 330 C641 294 670 276 690 246 C709 278 739 296 718 330 C704 350 676 350 662 330 Z" fill="#f59e0b" opacity="0.9" />
          <path d="M675 330 C662 302 681 286 690 266 C701 288 719 304 706 330 C698 342 683 342 675 330 Z" fill="#fff7ad" opacity="0.95" />
        </g>

        <g id="watch-glass" filter="url(#soft-shadow)">
          <ellipse cx="690" cy="565" rx="150" ry="45" fill="url(#glass)" stroke="#243241" stroke-width="4" />
          <ellipse cx="690" cy="553" rx="113" ry="22" fill="#ffffff" opacity="0.35" />
          <path d="M559 573 C623 606 757 606 822 573" fill="none" stroke="#5b7c86" stroke-width="3" />
          <g id="ash-pile" class="will-animate">
            <path d="M619 569 C646 548 725 545 765 569 C730 586 655 587 619 569 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
            <circle cx="658" cy="558" r="4" fill="#ffffff" />
            <circle cx="692" cy="552" r="5" fill="#ffffff" />
            <circle cx="731" cy="561" r="4" fill="#ffffff" />
            <circle cx="675" cy="566" r="3.2" fill="#ffffff" />
            <circle cx="708" cy="565" r="3.5" fill="#ffffff" />
            <circle cx="716" cy="557" r="2.8" fill="#ffffff" />
          </g>
        </g>

        <g id="contact-glow" class="screen will-animate" opacity="0">
          <circle cx="690" cy="246" r="88" fill="url(#yellow-glow)" />
          <circle cx="690" cy="246" r="24" fill="#fff7ad" />
        </g>

        <g id="moving-tongs" class="will-animate">
          <g id="lit-flame" class="screen will-animate" opacity="0">
            <circle cx="0" cy="0" r="104" fill="url(#white-glow)" />
            <circle cx="0" cy="0" r="28" fill="#ffffff" />
            <g id="white-rays" stroke="#ffffff" stroke-linecap="round">
              <line x1="0" y1="0" x2="-122" y2="0" stroke-width="4" />
              <line x1="0" y1="0" x2="122" y2="0" stroke-width="4" />
              <line x1="0" y1="0" x2="0" y2="-122" stroke-width="4" />
              <line x1="0" y1="0" x2="0" y2="122" stroke-width="4" />
              <line x1="0" y1="0" x2="-88" y2="-88" stroke-width="3" />
              <line x1="0" y1="0" x2="88" y2="88" stroke-width="3" />
              <line x1="0" y1="0" x2="88" y2="-88" stroke-width="3" />
              <line x1="0" y1="0" x2="-88" y2="88" stroke-width="3" />
            </g>
          </g>

          <g id="magnesium-ribbon">
            <path d="M0 0 C15 -9 18 -23 9 -35 C24 -30 34 -21 33 -8 C32 6 18 12 0 0 Z" fill="url(#magnesium)" stroke="#706f4c" stroke-width="2" />
            <path d="M29 -17 C54 -25 74 -31 98 -40" fill="none" stroke="url(#magnesium)" stroke-width="11" stroke-linecap="round" />
            <path d="M29 -17 C54 -25 74 -31 98 -40" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" opacity="0.5" />
          </g>

          <g id="tongs" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M92 -56 C190 -82 310 -98 450 -96" stroke="url(#steel)" stroke-width="12" />
            <path d="M102 -24 C202 -50 318 -60 458 -52" stroke="url(#steel)" stroke-width="12" />
            <path d="M92 -56 L72 -45 M102 -24 L76 -31" stroke="#334155" stroke-width="5" />
            <ellipse cx="512" cy="-98" rx="52" ry="25" stroke="#334155" stroke-width="10" />
            <ellipse cx="526" cy="-50" rx="52" ry="25" stroke="#334155" stroke-width="10" />
            <path d="M450 -96 C476 -96 492 -98 512 -98" stroke="#334155" stroke-width="10" />
            <path d="M458 -52 C484 -50 503 -50 526 -50" stroke="#334155" stroke-width="10" />
          </g>
        </g>

        <g id="labels">
          <text class="label" x="390" y="628">Tilted burner flame</text>
          <path class="leader" d="M515 604 L690 330" />

          <text class="label" x="612" y="650">Watch glass / bowl</text>
          <path class="leader" d="M720 624 L700 570" />

          <text class="label" x="850" y="315">White dazzling flame</text>
          <path class="leader" d="M838 322 L704 250" />

          <text class="label" x="860" y="430">White MgO ash forms in bowl</text>
          <path class="leader" d="M848 422 L724 555" />
        </g>
      </svg>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script>
      function startAnimation() {
        if (!window.gsap) {
          document.documentElement.classList.add("no-gsap");
          return;
        }

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const { gsap } = window;

        gsap.set("#moving-tongs", {
          x: 910,
          y: 166,
          rotation: -4,
          transformOrigin: "0px 0px",
        });
        gsap.set("#contact-glow", {
          opacity: 0,
          scale: 0.4,
          transformOrigin: "690px 246px",
        });
        gsap.set("#lit-flame", {
          opacity: 0,
          scale: 0.45,
          transformOrigin: "0px 0px",
        });
        gsap.set("#white-rays", {
          scale: 0.62,
          rotation: -8,
          transformOrigin: "0px 0px",
        });
        gsap.set("#ash-pile", {
          opacity: 0,
        });
        if (reduceMotion) {
          gsap.set("#moving-tongs", { x: 690, y: 246, rotation: -3 });
          gsap.set("#lit-flame", { opacity: 1, scale: 1 });
          gsap.set("#ash-pile", { opacity: 1 });
          return;
        }

        const timeline = gsap.timeline({
          repeat: -1,
          repeatDelay: 0.75,
          defaults: { ease: "power2.out" },
        });

        timeline
          .addLabel("approach", 0)
          .to(
            "#moving-tongs",
            {
              x: 690,
              y: 246,
              rotation: -3,
              duration: 1.35,
              ease: "power3.inOut",
            },
            "approach"
          )
          .addLabel("touch", 1.32)
          .to(
            "#contact-glow",
            {
              opacity: 1,
              scale: 1.15,
              duration: 0.2,
              ease: "expo.out",
            },
            "touch"
          )
          .to(
            "#contact-glow",
            {
              opacity: 0,
              scale: 0.55,
              duration: 0.34,
              ease: "sine.in",
            },
            "touch+=0.18"
          )
          .to(
            "#lit-flame",
            {
              opacity: 1,
              scale: 1.08,
              duration: 0.26,
              ease: "expo.out",
            },
            "touch+=0.12"
          )
          .to(
            "#white-rays",
            {
              scale: 1.08,
              rotation: 8,
              duration: 0.32,
              ease: "power2.out",
            },
            "touch+=0.12"
          )
          .addLabel("burnHeld", 1.9)
          .to(
            "#lit-flame",
            {
              scale: 1.2,
              duration: 0.5,
              ease: "sine.inOut",
            },
            "burnHeld+=0.12"
          )
          .addLabel("ashForms", 2.35)
          .to(
            "#ash-pile",
            {
              opacity: 1,
              duration: 0.65,
              ease: "power1.out",
            },
            "ashForms"
          )
          .to(
            "#lit-flame",
            {
              opacity: 0.82,
              scale: 0.96,
              duration: 0.72,
              ease: "sine.inOut",
            },
            "ashForms+=0.52"
          )
          .addLabel("reset", 4.3)
          .to(
            "#lit-flame",
            {
              opacity: 0,
              scale: 0.58,
              duration: 0.35,
              ease: "sine.in",
            },
            "reset"
          )
          .to(
            "#moving-tongs",
            {
              x: 910,
              y: 166,
              rotation: -4,
              duration: 0.8,
              ease: "power2.inOut",
            },
            "reset+=0.1"
          )
          .to(
            "#ash-pile",
            {
              opacity: 0,
              duration: 0.3,
              ease: "power1.inOut",
            },
            "reset+=0.35"
          );
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startAnimation);
      } else {
        startAnimation();
      }
    </script>
  </body>
</html>
