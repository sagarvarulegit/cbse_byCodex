<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2025" viewBox="0 0 2400 2025">
  <defs>
    <marker id="arrow11" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#0284c7"/>
    </marker>
    <style>
      .panel{fill:#f8fafc;stroke:#0f172a;stroke-width:4}
      .sub{fill:#fff;stroke:#cbd5e1;stroke-width:3}
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}
      .case{font:700 21px Arial,sans-serif;fill:#0f766e}
      .label{font:700 22px Arial,sans-serif;fill:#334155}
      .small{font:600 18px Arial,sans-serif;fill:#475569}
      .wire{fill:none;stroke:#0f172a;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
      .current{fill:none;stroke:#0284c7;stroke-width:5;marker-end:url(#arrow11)}
      .meter{fill:#fff;stroke:#0f172a;stroke-width:6}
      .resistor{fill:#fef3c7;stroke:#92400e;stroke-width:6}
      .node{fill:#0f172a}
      .axis{stroke:#0f172a;stroke-width:6}
      .grid{stroke:#cbd5e1;stroke-width:2}
    </style>
    <g id="cell11">
      <line class="wire" x1="-42" y1="0" x2="-12" y2="0"/>
      <line x1="-12" y1="-28" x2="-12" y2="28" stroke="#0f172a" stroke-width="6"/>
      <line x1="12" y1="-16" x2="12" y2="16" stroke="#0f172a" stroke-width="6"/>
      <line class="wire" x1="12" y1="0" x2="42" y2="0"/>
    </g>
    <g id="key11">
      <circle class="node" cx="-30" cy="0" r="7"/><circle class="node" cx="30" cy="0" r="7"/>
      <line class="wire" x1="-70" y1="0" x2="-30" y2="0"/>
      <line class="wire" x1="30" y1="0" x2="70" y2="0"/>
      <line x1="-30" y1="-2" x2="30" y2="-2" stroke="#0f172a" stroke-width="6"/>
    </g>
    <g id="ammeter11">
      <circle class="meter" r="42"/><text class="label" x="-14" y="9">A</text>
    </g>
    <g id="voltmeter11">
      <circle class="meter" r="42"/><text class="label" x="-14" y="9">V</text>
    </g>
    <g id="bulb11">
      <circle class="meter" r="45"/>
      <path d="M-28 -28L28 28M28 -28L-28 28" stroke="#f59e0b" stroke-width="8"/>
    </g>
    <g id="rheostat11">
      <rect class="resistor" x="-75" y="-25" width="150" height="50" rx="8"/>
      <path d="M-55 0L-35 -14L-15 14L5 -14L25 14L45 -14L60 0" fill="none" stroke="#92400e" stroke-width="5"/>
      <path d="M10 -70V-16" stroke="#0284c7" stroke-width="6" marker-end="url(#arrow11)"/>
    </g>
  </defs>

  <!-- Figure 11.1 -->
  <g>
    <rect class="panel" x="2" y="2" width="1196" height="671" rx="24"/>
    <text class="title" x="42" y="48">Figure 11.1 · Basic electric circuit</text>
    <g transform="translate(70 100)">
      <rect class="sub" width="1060" height="505" rx="20"/>
      <path class="wire" d="M150 120H850V390H150Z"/>
      <use href="#cell11" transform="translate(300 390)"/>
      <use href="#key11" transform="translate(560 390)"/>
      <use href="#ammeter11" transform="translate(780 390)"/>
      <use href="#bulb11" transform="translate(850 225)"/>
      <path class="current" d="M190 120H420"/>
      <text class="case" x="110" y="80">One closed path: cell → key → ammeter → bulb</text>
      <text class="label" x="280" y="455">cell</text>
      <text class="label" x="535" y="455">key</text>
      <text class="label" x="750" y="455">ammeter</text>
      <text class="label" x="900" y="230">bulb</text>
      <text class="small" x="430" y="165">conventional current</text>
    </g>
  </g>

  <!-- Figure 11.2 -->
  <g transform="translate(1200 0)">
    <rect class="panel" x="2" y="2" width="1196" height="671" rx="24"/>
    <text class="title" x="42" y="48">Figure 11.2 · Ohm’s-law experimental circuit</text>
    <g transform="translate(55 90)">
      <rect class="sub" width="1090" height="525" rx="20"/>
      <path class="wire" d="M125 155H925V410H125Z"/>
      <use href="#cell11" transform="translate(230 410)"/>
      <use href="#cell11" transform="translate(320 410)"/>
      <use href="#key11" transform="translate(485 410)"/>
      <use href="#rheostat11" transform="translate(690 410)"/>
      <use href="#ammeter11" transform="translate(910 410)"/>
      <rect class="resistor" x="460" y="128" width="220" height="54" rx="8"/>
      <text class="label" x="535" y="164">XY</text>
      <path class="wire" d="M460 155H350V260H528M612 260H790V155H680"/>
      <use href="#voltmeter11" transform="translate(570 260)"/>
      <path class="current" d="M160 155H340"/>
      <text class="case" x="115" y="70">A in series · V across nichrome wire XY</text>
      <text class="small" x="570" y="320">voltmeter branch</text>
      <text class="small" x="640" y="490">rheostat changes current</text>
    </g>
  </g>

  <!-- Figure 11.3 -->
  <g transform="translate(0 675)">
    <rect class="panel" x="2" y="2" width="1196" height="671" rx="24"/>
    <text class="title" x="42" y="48">Figure 11.3 · Potential difference versus current</text>
    <g transform="translate(90 90)">
      <rect class="sub" width="1020" height="525" rx="20"/>
      <g transform="translate(180 430)">
        <line class="axis" x1="0" y1="0" x2="700" y2="0"/>
        <line class="axis" x1="0" y1="0" x2="0" y2="-335"/>
        <path d="M700 0l-22-12v24Z" fill="#0f172a"/>
        <path d="M0 -335l-12 22h24Z" fill="#0f172a"/>
        <line class="grid" x1="0" y1="-80" x2="700" y2="-80"/>
        <line class="grid" x1="0" y1="-160" x2="700" y2="-160"/>
        <line class="grid" x1="0" y1="-240" x2="700" y2="-240"/>
        <line class="grid" x1="140" y1="0" x2="140" y2="-335"/>
        <line class="grid" x1="280" y1="0" x2="280" y2="-335"/>
        <line class="grid" x1="420" y1="0" x2="420" y2="-335"/>
        <line class="grid" x1="560" y1="0" x2="560" y2="-335"/>
        <path d="M0 0L650 -300" fill="none" stroke="#0284c7" stroke-width="9"/>
        <circle cx="140" cy="-65" r="8" fill="#e11d48"/>
        <circle cx="280" cy="-129" r="8" fill="#e11d48"/>
        <circle cx="420" cy="-194" r="8" fill="#e11d48"/>
        <circle cx="560" cy="-258" r="8" fill="#e11d48"/>
        <text class="label" x="665" y="38">I</text>
        <text class="label" x="-36" y="-320">V</text>
        <text class="small" x="250" y="55">current (ampere)</text>
        <text class="small" transform="translate(-72 -170) rotate(-90)">potential difference (volt)</text>
      </g>
      <text class="case" x="610" y="100">straight line through origin</text>
      <text class="case" x="610" y="135">slope V/I = resistance R</text>
    </g>
  </g>

  <!-- Figure 11.6 -->
  <g transform="translate(1200 675)">
    <rect class="panel" x="2" y="2" width="1196" height="671" rx="24"/>
    <text class="title" x="42" y="48">Figure 11.6 · Three resistors in series</text>
    <g transform="translate(55 90)">
      <rect class="sub" width="1090" height="525" rx="20"/>
      <path class="wire" d="M100 170H990V410H100Z"/>
      <rect class="resistor" x="265" y="143" width="150" height="54" rx="8"/>
      <rect class="resistor" x="470" y="143" width="150" height="54" rx="8"/>
      <rect class="resistor" x="675" y="143" width="150" height="54" rx="8"/>
      <text class="label" x="325" y="178">R₁</text>
      <text class="label" x="530" y="178">R₂</text>
      <text class="label" x="735" y="178">R₃</text>
      <use href="#cell11" transform="translate(250 410)"/>
      <use href="#key11" transform="translate(465 410)"/>
      <use href="#ammeter11" transform="translate(850 410)"/>
      <path class="wire" d="M265 170H210V275H503M587 275H880V170H825"/>
      <use href="#voltmeter11" transform="translate(545 275)"/>
      <path class="current" d="M110 170H225"/>
      <text class="case" x="130" y="85">Same current I passes through R₁, R₂ and R₃</text>
      <text class="small" x="425" y="337">voltmeter across complete series group</text>
    </g>
  </g>

  <!-- Figure 11.7 -->
  <g transform="translate(0 1350)">
    <rect class="panel" x="2" y="2" width="1196" height="671" rx="24"/>
    <text class="title" x="42" y="48">Figure 11.7 · Three resistors in parallel</text>
    <g transform="translate(55 90)">
      <rect class="sub" width="1090" height="525" rx="20"/>
      <path class="wire" d="M135 120H900V410H135Z"/>
      <circle class="node" cx="330" cy="120" r="8"/><circle class="node" cx="780" cy="120" r="8"/>
      <text class="label" x="305" y="92">X</text><text class="label" x="770" y="92">Y</text>
      <path class="wire" d="M330 120V310M780 120V310"/>
      <path class="wire" d="M330 165H780M330 235H780M330 305H780"/>
      <rect class="resistor" x="475" y="138" width="160" height="54" rx="8"/>
      <rect class="resistor" x="475" y="208" width="160" height="54" rx="8"/>
      <rect class="resistor" x="475" y="278" width="160" height="54" rx="8"/>
      <text class="label" x="535" y="174">R₁</text>
      <text class="label" x="535" y="244">R₂</text>
      <text class="label" x="535" y="314">R₃</text>
      <use href="#cell11" transform="translate(245 410)"/>
      <use href="#key11" transform="translate(435 410)"/>
      <use href="#ammeter11" transform="translate(820 410)"/>
      <path class="wire" d="M330 120H245V55H513M597 55H865V120H780"/>
      <use href="#voltmeter11" transform="translate(555 55)"/>
      <path class="current" d="M145 120H285"/>
      <text class="case" x="120" y="480">Each branch has the same potential difference V</text>
      <text class="small" x="710" y="480">total current divides at X</text>
    </g>
  </g>
</svg>
