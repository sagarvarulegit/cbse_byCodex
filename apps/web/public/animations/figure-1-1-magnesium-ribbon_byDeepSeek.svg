<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img" aria-labelledby="title-desc">
  <title id="title-desc">Magnesium ribbon burning in air — CBSE Class 10 Science Chapter 1</title>
  <desc id="title-desc">
    A magnesium ribbon held by tongs is brought close to a Bunsen burner flame. It ignites with a dazzling white
    flare, producing white magnesium oxide ash that falls into a watch-glass below.
  </desc>

  <defs>
    <!-- Lab bench gradient -->
    <linearGradient id="bench" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d4a843" />
      <stop offset="0.45" stop-color="#c89a32" />
      <stop offset="0.55" stop-color="#b88928" />
      <stop offset="1" stop-color="#9c751f" />
    </linearGradient>

    <!-- Burner body gradient -->
    <linearGradient id="burnerBody" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3a3f42" />
      <stop offset="0.3" stop-color="#6b767c" />
      <stop offset="0.7" stop-color="#8a969d" />
      <stop offset="1" stop-color="#4a5256" />
    </linearGradient>

    <!-- Metal tube gradient -->
    <linearGradient id="metalTube" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#5c686e" />
      <stop offset="0.4" stop-color="#bcc9ce" />
      <stop offset="0.7" stop-color="#dce7ec" />
      <stop offset="1" stop-color="#6e7b82" />
    </linearGradient>

    <!-- Tongs steel gradient -->
    <linearGradient id="tongsSteel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#eef5f7" />
      <stop offset="0.35" stop-color="#8e9ba2" />
      <stop offset="0.65" stop-color="#d1dade" />
      <stop offset="1" stop-color="#647077" />
    </linearGradient>

    <!-- Magnesium ribbon gradient -->
    <linearGradient id="mgStrip" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff4b0" />
      <stop offset="0.35" stop-color="#e8e096" />
      <stop offset="0.7" stop-color="#fcf5c0" />
      <stop offset="1" stop-color="#e8e096" />
    </linearGradient>

    <!-- White dazzle flare -->
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.5" stop-color="#fef9d7" stop-opacity="0.7" />
      <stop offset="0.75" stop-color="#f7cc5c" stop-opacity="0.3" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Spark glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="0.4" stop-color="#e2efff" stop-opacity="0.9" />
      <stop offset="0.7" stop-color="#93c5fd" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Watch-glass glass tint -->
    <linearGradient id="glassTint" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c8e6ed" stop-opacity="0.7" />
      <stop offset="0.5" stop-color="#dff2f6" stop-opacity="0.55" />
      <stop offset="1" stop-color="#91b9c2" stop-opacity="0.65" />
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" />
    </filter>

    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <style>
    svg {
      background:
        repeating-linear-gradient(0deg, rgba(15, 23, 42, 0.04), rgba(15, 23, 42, 0.04) 1px, transparent 1px, transparent 28px),
        repeating-linear-gradient(90deg, rgba(15, 23, 42, 0.025), rgba(15, 23, 42, 0.025) 1px, transparent 1px, transparent 28px),
        linear-gradient(160deg, #f8fcff, #ecf5fa);
      font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    }

    /* ========== LABEL STYLES ========== */
    .label-line { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-linecap: round; }
    .label-text { font-size: 15px; font-weight: 700; fill: #1e293b; }
    .title-text { font-size: 20px; font-weight: 800; fill: #0f172a; }

    /* ========== BURNER FLAME (static, no flicker) ========== */
    .flame-group { transform-box: fill-box; transform-origin: center bottom; }

    /* ========== TONGS APPROACH ========== */
    .approach-group {
      transform-origin: 460px 240px;
      animation: approach-cycle 5s cubic-bezier(0.7, 0, 0.3, 1) infinite;
    }
    @keyframes approach-cycle {
      0%, 18%  { transform: translate(110px, -50px) rotate(-4deg); }
      38%, 100% { transform: translate(0, 0) rotate(0deg); }
    }

    /* ========== RIBBON HEAT GLOW ========== */
    .ribbon-glow {
      opacity: 0;
      transform-origin: 460px 240px;
      animation: heat-glow-cycle 5s ease-in-out infinite;
    }
    @keyframes heat-glow-cycle {
      0%, 32%  { opacity: 0; transform: scale(0.7); }
      40%      { opacity: 1; transform: scale(1.15); }
      70%      { opacity: 0.9; transform: scale(1); }
      100%     { opacity: 0; transform: scale(0.85); }
    }

    /* ========== DAZZLING WHITE BURST ========== */
    .burst-group {
      opacity: 0;
      mix-blend-mode: screen;
      transform-origin: 460px 240px;
      animation: burst-cycle 5s ease-in-out infinite;
    }
    @keyframes burst-cycle {
      0%, 34%  { opacity: 0; transform: scale(0.4); }
      42%      { opacity: 1; transform: scale(1.2); }
      60%      { opacity: 0.98; transform: scale(1); }
      80%      { opacity: 0.6; transform: scale(0.9); }
      100%     { opacity: 0; transform: scale(0.7); }
    }

    /* ========== STAR RAYS ========== */
    .star-rays {
      transform-origin: 460px 240px;
      animation: rays-cycle 5s ease-in-out infinite;
    }
    @keyframes rays-cycle {
      0%, 34%  { opacity: 0; transform: scale(0.35) rotate(-10deg); }
      43%      { opacity: 1; transform: scale(1.15) rotate(5deg); }
      62%      { opacity: 0.9; transform: scale(0.95) rotate(-2deg); }
      100%     { opacity: 0; transform: scale(0.7) rotate(8deg); }
    }

    /* ========== ASH COLUMN ========== */
    .ash-column {
      opacity: 0;
      animation: ash-col-cycle 5s linear infinite;
    }
    @keyframes ash-col-cycle {
      0%, 46%  { opacity: 0; }
      54%, 88% { opacity: 1; }
      100%     { opacity: 0; }
    }

    /* ========== ASH PARTICLES ========== */
    .ash-particle {
      opacity: 0;
    }
    .p1 { animation: fall-cycle 5s linear infinite; }
    .p2 { animation: fall-cycle 5s linear infinite; animation-delay: 0.12s; }
    .p3 { animation: fall-cycle 5s linear infinite; animation-delay: 0.24s; }
    .p4 { animation: fall-cycle 5s linear infinite; animation-delay: 0.36s; }
    .p5 { animation: fall-cycle 5s linear infinite; animation-delay: 0.48s; }
    .p6 { animation: fall-cycle 5s linear infinite; animation-delay: 0.6s; }
    .p7 { animation: fall-cycle 5s linear infinite; animation-delay: 0.72s; }
    .p8 { animation: fall-cycle 5s linear infinite; animation-delay: 0.84s; }

    @keyframes fall-cycle {
      0%, 50%  { opacity: 0; transform: translate(0, 0) scale(0.5); }
      56%      { opacity: 1; transform: translate(0, 0) scale(0.8); }
      85%      { opacity: 1; transform: translate(0, 185px) scale(1.1); }
      100%     { opacity: 0; transform: translate(0, 185px) scale(1.2); }
    }

    /* ========== OXIDE PILE IN WATCH-GLASS ========== */
    .oxide-pile {
      transform-origin: 460px 455px;
      animation: pile-cycle 5s ease-in-out infinite;
    }
    @keyframes pile-cycle {
      0%, 52%  { transform: scaleX(0.6) scaleY(0.6); opacity: 0.3; }
      82%, 100% { transform: scaleX(1) scaleY(1); opacity: 1; }
    }

    /* ========== REDUCED MOTION ========== */
    @media (prefers-reduced-motion: reduce) {
      .approach-group, .ribbon-glow,
      .burst-group, .star-rays,
      .ash-column, .ash-particle,
      .oxide-pile {
        animation: none !important;
      }
      .approach-group { transform: none; }
      .burst-group { opacity: 1; }
      .ribbon-glow { opacity: 1; }
      .ash-column { opacity: 1; }
      .ash-particle { opacity: 1; }
    }

    /* ========== DARK MODE ========== */
    @media (prefers-color-scheme: dark) {
      svg {
        background:
          repeating-linear-gradient(0deg, rgba(255,255,255,0.04), rgba(255,255,255,0.04) 1px, transparent 1px, transparent 28px),
          repeating-linear-gradient(90deg, rgba(255,255,255,0.025), rgba(255,255,255,0.025) 1px, transparent 1px, transparent 28px),
          linear-gradient(160deg, #1a2420, #101816);
      }
      .label-text, .title-text { fill: #e8f0ec; }
      .label-line { stroke: #94a3b8; }
    }
  </style>

  <!-- ===== BACKGROUND / TITLE ===== -->
  <text x="480" y="42" class="title-text" text-anchor="middle">Figure 1.1 — Burning Magnesium Ribbon in Air</text>

  <!-- ===== LAB BENCH ===== -->
  <g id="bench">
    <path d="M40 445 L800 445 L880 400 L120 400 Z" fill="url(#bench)" stroke="#4a3520" stroke-width="2.5" />
    <path d="M40 445 L800 445 L800 490 L40 490 Z" fill="#a8822e" stroke="#4a3520" stroke-width="2.5" />
    <path d="M800 445 L880 400 L880 445 L800 490 Z" fill="#dfbd6a" stroke="#4a3520" stroke-width="2.5" />
    <!-- Bench top edge highlight -->
    <path d="M120 400 L880 400" fill="none" stroke="#f3d485" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- ===== BUNSEN BURNER ===== -->
  <g id="burner">
    <!-- Base -->
    <ellipse cx="320" cy="438" rx="55" ry="14" fill="#3a3f42" stroke="#1f2224" stroke-width="2.5" />
    <!-- Body -->
    <path d="M280 380 L360 380 L370 438 L270 438 Z" fill="url(#burnerBody)" stroke="#1f2224" stroke-width="2.5" />
    <!-- Air hole collar -->
    <rect x="288" y="370" width="64" height="16" rx="4" fill="#7c888f" stroke="#1f2224" stroke-width="2" />
    <path d="M295 370 L305 386 M310 370 L320 386 M325 370 L335 386 M340 370 L350 386" stroke="#1f2224" stroke-width="1.5" opacity="0.5" />
    <!-- Tube -->
    <path d="M340 370 L460 240" fill="none" stroke="url(#metalTube)" stroke-width="32" stroke-linecap="round" />
    <path d="M340 370 L460 240" fill="none" stroke="#1f2224" stroke-width="2.5" stroke-linecap="round" />
    <!-- Nozzle tip -->
    <ellipse cx="460" cy="240" rx="16" ry="7" fill="#b7c4c8" stroke="#1f2224" stroke-width="2" transform="rotate(-68 460 240)" />
  </g>

  <!-- ===== BURNER FLAME (static) ===== -->
  <g class="flame-group">
    <!-- Flame glow halo -->
    <ellipse cx="460" cy="240" rx="70" ry="60" fill="url(#flare)" filter="url(#glow)" opacity="0.6" />
    <!-- Outer flame -->
    <path d="M442 234 C412 266 440 300 468 268 C498 236 474 204 464 168 C462 200 450 216 442 234 Z" fill="rgba(255,255,255,0.85)" filter="url(#glow)" />
    <!-- Inner flame -->
    <path d="M454 242 C440 261 456 280 474 260 C488 240 476 218 470 198 C467 216 462 228 454 242 Z" fill="#ffc83d" />
  </g>

  <!-- ===== WATCH-GLASS ===== -->
  <g id="watch-glass">
    <!-- Outer glass rim -->
    <ellipse cx="460" cy="452" rx="130" ry="38" fill="url(#glassTint)" stroke="#1f2224" stroke-width="2.5" />
    <!-- Inner glass highlight -->
    <ellipse cx="460" cy="444" rx="100" ry="20" fill="#ffffff" opacity="0.2" />
    <!-- Glass bottom curve -->
    <path d="M346 456 C400 484 520 484 574 456" fill="none" stroke="#53727a" stroke-width="2" opacity="0.5" />
    <!-- MgO white ash pile -->
    <ellipse class="oxide-pile" cx="460" cy="458" fill="#fbfbf7" rx="60" ry="10" stroke="#8da0a0" stroke-width="1" />
  </g>

  <!-- ===== TONGS + MAGNESIUM RIBBON (ANIMATED APPROACH) ===== -->
  <g class="approach-group">
    <!-- Tongs -->
    <g id="tongs" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Upper arm -->
      <path d="M478 228 C565 200 640 182 730 148" stroke="url(#tongsSteel)" stroke-width="10" />
      <!-- Lower arm -->
      <path d="M484 256 C574 224 648 202 738 182" stroke="url(#tongsSteel)" stroke-width="10" />
      <!-- Pivot joint -->
      <circle cx="565" cy="208" r="9" fill="#f1f5f9" stroke="#1f2224" stroke-width="2.5" />
      <!-- Handle rings -->
      <ellipse cx="768" cy="136" rx="28" ry="18" fill="none" stroke="#1f2224" stroke-width="3.5" transform="rotate(-18 768 136)" />
      <ellipse cx="776" cy="184" rx="28" ry="18" fill="none" stroke="#1f2224" stroke-width="3.5" transform="rotate(-14 776 184)" />
      <!-- Arm outlines -->
      <path d="M730 148 C744 141 756 138 768 136" stroke="#1f2224" stroke-width="3.5" />
      <path d="M738 182 C754 184 766 184 776 184" stroke="#1f2224" stroke-width="3.5" />
      <!-- Gripping jaws -->
      <path d="M478 228 L456 236" stroke="#3d474d" stroke-width="4" />
      <path d="M484 256 L456 244" stroke="#3d474d" stroke-width="4" />
    </g>

    <!-- Magnesium ribbon -->
    <g class="mg-ribbon-group">
      <!-- Main ribbon body -->
      <polygon points="456,236 590,186 596,201 461,250" fill="url(#mgStrip)" stroke="#6b694d" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Highlight edge -->
      <polygon points="468,237 582,196 585,200 471,243" fill="rgba(255,252,210,0.6)" />
      <!-- Hot tip (closest to flame) -->
      <polygon points="456,236 488,224 493,240 461,250" fill="#fff6aa" opacity="0.85" />
    </g>

    <!-- Ribbon pre-heat glow -->
    <g class="ribbon-glow">
      <ellipse cx="460" cy="240" rx="80" ry="60" fill="url(#flare)" filter="url(#glow)" />
      <polygon points="456,236 490,224 494,240 461,250" fill="#ffffff" opacity="0.9" />
    </g>
  </g>

  <!-- ===== DAZZLING WHITE BURST (ANIMATED) ===== -->
  <g class="burst-group">
    <!-- Wide glow -->
    <circle cx="460" cy="240" r="110" fill="url(#sparkGlow)" filter="url(#bigGlow)" />
    <!-- Inner core -->
    <circle cx="460" cy="240" r="40" fill="#ffffff" />
    <!-- Star rays -->
    <g class="star-rays" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
      <line x1="460" y1="240" x2="330" y2="240" />
      <line x1="460" y1="240" x2="590" y2="240" />
      <line x1="460" y1="240" x2="460" y2="110" />
      <line x1="460" y1="240" x2="460" y2="370" />
      <line x1="460" y1="240" x2="370" y2="150" />
      <line x1="460" y1="240" x2="550" y2="330" />
      <line x1="460" y1="240" x2="550" y2="150" />
      <line x1="460" y1="240" x2="370" y2="330" />
    </g>
  </g>

  <!-- ===== ASH / MgO PARTICLES FALLING (ANIMATED) ===== -->
  <g class="ash-column">
    <path d="M460 260 L460 455" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.6" />
    <circle class="ash-particle p1" cx="460" cy="260" r="4.5" fill="#ffffff" />
    <circle class="ash-particle p2" cx="460" cy="260" r="3.5" fill="#f5faf5" />
    <circle class="ash-particle p3" cx="460" cy="260" r="5" fill="#ffffff" />
    <circle class="ash-particle p4" cx="460" cy="260" r="4" fill="#f0f8f0" />
    <circle class="ash-particle p5" cx="460" cy="260" r="3.2" fill="#ffffff" />
    <circle class="ash-particle p6" cx="460" cy="260" r="4.8" fill="#fafffa" />
    <circle class="ash-particle p7" cx="460" cy="260" r="3.8" fill="#ffffff" />
    <circle class="ash-particle p8" cx="460" cy="260" r="4" fill="#f2faf5" />
  </g>

  <!-- ===== EQUATION PANEL ===== -->
  <g id="equation" transform="translate(40 48)">
    <rect x="-10" y="-8" width="310" height="114" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="22" y="28" font-size="24" font-weight="800" fill="#0f172a" text-anchor="middle">2Mg + O₂ → 2MgO</text>
    <text x="-25" y="52" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">(s)</text>
    <text x="70" y="52" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">(g)</text>
    <text x="195" y="52" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle">(s)</text>
    <text x="145" y="84" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Magnesium burns with a dazzling</text>
    <text x="145" y="100" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">white flame to form white MgO ash</text>
  </g>

  <!-- ===== LABELS ===== -->
  <g id="labels">
    <!-- Tongs -->
    <path d="M745 134 L715 152" class="label-line" />
    <text x="762" y="138" class="label-text">Tongs</text>

    <!-- Magnesium ribbon -->
    <path d="M745 184 L590 196" class="label-line" />
    <text x="762" y="188" class="label-text">Magnesium ribbon</text>

    <!-- Dazzling white flame -->
    <path d="M745 234 L460 240" class="label-line" />
    <text x="762" y="238" class="label-text">Dazzling white flame</text>

    <!-- Bunsen burner -->
    <path d="M745 320 L350 410" class="label-line" />
    <text x="762" y="324" class="label-text">Bunsen burner</text>

    <!-- Watch-glass -->
    <path d="M745 390 L570 450" class="label-line" />
    <text x="762" y="394" class="label-text">Watch-glass</text>

    <!-- MgO ash -->
    <path d="M745 444 L470 458" class="label-line" />
    <text x="762" y="448" class="label-text">MgO (white ash)</text>
  </g>

  <!-- ===== CAUTION NOTE ===== -->
  <g id="caution" transform="translate(60 540)">
    <rect x="0" y="0" width="550" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <!-- Triangle warning icon -->
    <path d="M30 22 L48 60 L12 60 Z" fill="#d97706" />
    <text x="30" y="52" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">!</text>
    <text x="66" y="34" font-size="17" font-weight="800" fill="#78350f">CAUTION:</text>
    <text x="66" y="56" font-size="14" font-weight="700" fill="#92400e">Never look directly at the burning magnesium. Wear safety glasses. Perform only under teacher supervision.</text>
    <!-- Observation note -->
    <rect x="570" y="0" width="260" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <text x="700" y="26" font-size="14" font-weight="800" fill="#0369a1" text-anchor="middle">OBSERVATION</text>
    <text x="700" y="48" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="middle">► Dazzling white flame</text>
    <text x="700" y="66" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="middle">► White ash (MgO) collected</text>
  </g>

</svg>
