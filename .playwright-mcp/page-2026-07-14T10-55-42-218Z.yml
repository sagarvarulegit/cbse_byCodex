          - paragraph [ref=f2e44]: A chemical reaction changes starting substances, called reactants, into new substances, called products. A chemical equation is a compact way to represent this change. In this lesson, we will learn to read and write equations. We will balance them in the next lesson.
          - heading "Learning goals" [level=3] [ref=f2e45]
          - paragraph [ref=f2e46]: "By the end of this lesson, you should be able to:"
          - list [ref=f2e47]:
            - listitem [ref=f2e48]: identify reactants and products
            - listitem [ref=f2e49]: recognise common observable signs of a reaction
            - listitem [ref=f2e50]: write a word equation
            - listitem [ref=f2e51]: convert simple chemical names into a formula equation
            - listitem [ref=f2e52]:
              - text: use
              - code [ref=f2e53]: (s)
              - text: ","
              - code [ref=f2e54]: (l)
              - text: ","
              - code [ref=f2e55]: (g)
              - text: ", and"
              - code [ref=f2e56]: (aq)
          - heading "What is a chemical reaction?" [level=3] [ref=f2e57]
          - paragraph [ref=f2e58]:
            - text: A
            - code [ref=f2e59]: reactant
            - text: is a starting substance in a reaction.
          - paragraph [ref=f2e60]:
            - text: A
            - code [ref=f2e61]: product
            - text: is a new substance formed by a reaction.
          - paragraph [ref=f2e62]:
            - text: A
            - code [ref=f2e63]: chemical reaction
            - text: is a process in which one or more reactants form new products. The atoms are rearranged, so the products have properties different from the starting substances.
          - heading "Signs of a chemical reaction" [level=3] [ref=f2e64]
          - paragraph [ref=f2e65]: "We often recognise a chemical reaction through an observable change:"
          - list [ref=f2e66]:
            - listitem [ref=f2e67]: "Colour change: when iron is placed in copper sulphate solution, a brown copper deposit forms and the solution changes colour."
            - listitem [ref=f2e68]: "Gas formation: zinc reacts with dilute sulphuric acid to produce hydrogen gas in a teacher-supervised laboratory example."
            - listitem [ref=f2e69]: "Temperature change: quicklime reacts with water and releases heat. Do not perform this reaction without teacher supervision."
            - listitem [ref=f2e70]: "Precipitate formation: barium sulphate can form as a white insoluble solid called a precipitate."
            - listitem [ref=f2e71]: "Change of state: gaseous hydrogen and oxygen can react to form liquid water."
          - paragraph [ref=f2e72]: One sign alone can suggest that a reaction occurred, but the key idea is that new substances formed.
