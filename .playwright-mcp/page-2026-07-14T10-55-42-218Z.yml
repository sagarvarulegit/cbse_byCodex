          - heading "From word equation to formula equation" [level=3] [ref=f2e159]
          - paragraph [ref=f2e160]: "First write the reaction using names:"
          - code [ref=f2e162]: magnesium + oxygen -> magnesium oxide
          - paragraph [ref=f2e163]: "Then replace each name with its correct formula:"
          - code [ref=f2e165]: Mg + O2 -> MgO
          - paragraph [ref=f2e166]:
            - text: Reactants are written on the left. Products are written on the right. The
            - code [ref=f2e167]: +
            - text: sign means "reacts with" or separates multiple substances. The
            - code [ref=f2e168]: "->"
            - text: arrow means "forms" or "produces".
          - paragraph [ref=f2e169]:
            - code [ref=f2e170]: Mg + O2 -> MgO
            - text: is a skeletal equation. It shows the correct substances, but it is not yet balanced.
          - paragraph [ref=f2e171]: "Here is another word equation:"
          - code [ref=f2e173]: zinc + sulphuric acid -> zinc sulphate + hydrogen
          - paragraph [ref=f2e174]: "Its formula equation is:"
          - code [ref=f2e176]: Zn + H2SO4 -> ZnSO4 + H2
          - heading "State symbols" [level=3] [ref=f2e177]
          - paragraph [ref=f2e178]: "State symbols tell us the physical state of a substance:"
          - list [ref=f2e179]:
            - listitem [ref=f2e180]:
              - code [ref=f2e181]: (s)
              - text: = solid
            - listitem [ref=f2e182]:
              - code [ref=f2e183]: (l)
              - text: = liquid
            - listitem [ref=f2e184]:
              - code [ref=f2e185]: (g)
              - text: = gas
            - listitem [ref=f2e186]:
              - code [ref=f2e187]: (aq)
              - text: = dissolved in water
          - paragraph [ref=f2e188]: "For example:"
          - code [ref=f2e190]: Zn(s) + H2SO4(aq) -> ZnSO4(aq) + H2(g)
          - paragraph [ref=f2e191]:
            - text: The symbol
            - code [ref=f2e192]: (aq)
            - text: does not mean liquid by itself. It means that the substance is dissolved in water and is present as an aqueous solution.
