<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2700" viewBox="0 0 2400 2700">
  <defs>
    <marker id="ray9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#0284c7"/>
    </marker>
    <marker id="virtual9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#e11d48"/>
    </marker>
    <marker id="object9" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#0f766e"/>
    </marker>
    <style>
      .panel{fill:#f8fafc;stroke:#0f172a;stroke-width:4}
      .sub{fill:#fff;stroke:#cbd5e1;stroke-width:3}
      .axis{stroke:#64748b;stroke-width:3}
      .ray{fill:none;stroke:#0284c7;stroke-width:5;marker-end:url(#ray9)}
      .raythin{fill:none;stroke:#0284c7;stroke-width:4}
      .virtual{fill:none;stroke:#e11d48;stroke-width:4;stroke-dasharray:11 9;marker-end:url(#virtual9)}
      .mirror{fill:none;stroke:#0f172a;stroke-width:9}
      .shade{fill:none;stroke:#94a3b8;stroke-width:3}
      .lens{fill:#dbeafe;fill-opacity:.72;stroke:#1d4ed8;stroke-width:7}
      .object{stroke:#0f766e;stroke-width:7;marker-end:url(#object9)}
      .image{stroke:#e11d48;stroke-width:7;marker-end:url(#virtual9)}
      .title{font:700 28px Arial,sans-serif;fill:#0f172a}
      .label{font:700 21px Arial,sans-serif;fill:#334155}
      .small{font:600 18px Arial,sans-serif;fill:#475569}
      .case{font:700 19px Arial,sans-serif;fill:#0f766e}
      .tick{stroke:#334155;stroke-width:4}
    </style>
    <g id="concaveMirror9">
      <path class="mirror" d="M0 -86Q38 0 0 86"/>
      <path class="shade" d="M10 -86l20 13M16 -62l22 14M20 -35l23 15M22 -7l24 15M21 22l22 14M16 50l21 14M9 75l18 12"/>
    </g>
    <g id="convexMirror9">
