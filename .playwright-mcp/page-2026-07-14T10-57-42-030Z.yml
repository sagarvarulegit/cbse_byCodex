            - paragraph [ref=f5e133]:
              - text: "Example:"
              - code [ref=f5e134]: H2 + O2 -> H2O
              - text: is not balanced.
            - paragraph [ref=f5e135]: "Balanced form:"
            - generic [ref=f5e136]:
