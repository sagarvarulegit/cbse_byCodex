            - heading "easy method" [level=4] [ref=f5e139]
            - list [ref=f5e140]:
              - listitem [ref=f5e141]: Count atoms on both sides.
              - listitem [ref=f5e142]: Balance one element at a time.
              - listitem [ref=f5e143]: Do not change formulae. Only change coefficients.
              - listitem [ref=f5e144]: Check again at the end.
            - paragraph [ref=f5e145]: "Combination reaction: two or more reactants combine to form one product."
