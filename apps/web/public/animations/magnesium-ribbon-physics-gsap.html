<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Magnesium Ribbon Burning - Physics-Aware GSAP Figure</title>
    <style>
      :root {
        color-scheme: dark;
        background: #050f24;
        font-family: Arial, Helvetica, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 36%, rgba(255, 255, 255, 0.08), transparent 0 22rem),
          linear-gradient(135deg, #030817, #071a36 52%, #050f24);
      }

      .stage {
        width: min(100vw, 1280px);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #07152d;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }

      svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      text {
        fill: #f8fbff;
        font-family: Arial, Helvetica, sans-serif;
        letter-spacing: 0;
      }

      .title {
        font-size: 34px;
        font-weight: 900;
      }

      .subtitle,
      .note {
        fill: #dbeafe;
        font-size: 15px;
        font-weight: 700;
      }

      .label {
        fill: #eff6ff;
        font-size: 17px;
        font-weight: 800;
      }

      .leader {
        fill: none;
        stroke: #bfdbfe;
        stroke-linecap: round;
        stroke-width: 2;
      }

      .screen {
        mix-blend-mode: screen;
      }

      .will-animate {
        transform-box: view-box;
        will-change: transform, opacity;
      }

      #burning-ribbon,
      #white-dazzle,
      #mgo-particles,
      #mgo-pile {
        opacity: 0;
      }

      .no-gsap #tongs-ribbon {
        animation: fallback-tongs 6.6s ease-in-out infinite;
        transform-origin: 0 0;
      }

      .no-gsap #burning-ribbon {
        animation: fallback-burn 6.6s ease-in-out infinite;
      }

      .no-gsap #white-dazzle {
        animation: fallback-dazzle 6.6s ease-in-out infinite;
      }

      .no-gsap #mgo-particles {
        animation: fallback-particles-visible 6.6s ease-in-out infinite;
      }

      .no-gsap .mgo-particle {
        animation: fallback-particle-fall 6.6s linear infinite;
        transform-box: view-box;
      }

      .no-gsap #mgo-pile {
        animation: fallback-pile 6.6s ease-in-out infinite;
      }

      @keyframes fallback-tongs {
        0%,
        14% {
          transform: translate(968px, 150px) rotate(-6deg);
        }

        34%,
        84% {
          transform: translate(720px, 260px) rotate(-2deg);
        }

        100% {
          transform: translate(968px, 150px) rotate(-6deg);
        }
      }

      @keyframes fallback-burn {
        0%,
        31%,
        91%,
        100% {
          opacity: 0;
        }

        38%,
        82% {
          opacity: 1;
        }
      }

      @keyframes fallback-dazzle {
        0%,
        34%,
        88%,
        100% {
          opacity: 0;
        }

        42%,
        72% {
          opacity: 1;
        }
      }

      @keyframes fallback-particles-visible {
        0%,
        48%,
        88%,
        100% {
          opacity: 0;
        }

        56%,
        78% {
          opacity: 1;
        }
      }

      @keyframes fallback-particle-fall {
        0%,
        50% {
          opacity: 0;
          transform: translateY(0);
        }

        58% {
          opacity: 1;
          transform: translateY(0);
        }

        80% {
          opacity: 1;
          transform: translate(var(--fall-x, 0px), 286px);
        }

        100% {
          opacity: 0;
          transform: translate(var(--fall-x, 0px), 286px);
        }
      }

      @keyframes fallback-pile {
        0%,
        54%,
        100% {
          opacity: 0;
        }

        72%,
        88% {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .no-gsap #tongs-ribbon,
        .no-gsap #burning-ribbon,
        .no-gsap #white-dazzle,
        .no-gsap #mgo-particles,
        .no-gsap .mgo-particle,
        .no-gsap #mgo-pile {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <svg viewBox="0 0 1280 720" role="img" aria-labelledby="figure-title figure-desc">
        <title id="figure-title">Magnesium ribbon burning in air</title>
        <desc id="figure-desc">
          A physics-aware animated chemistry figure: a magnesium ribbon is held in tongs, touches the top of a vertical
          flame rising from a tilted burner mouth, burns with a dazzling white light, and magnesium oxide powder forms
          at the burning tip before settling in the watch glass below.
        </desc>

        <defs>
          <linearGradient id="scene-bg" x1="0" x2="0" y1="0" y2="1">
            <stop stop-color="#06142d" />
            <stop offset="0.6" stop-color="#0a1f42" />
            <stop offset="1" stop-color="#10284d" />
          </linearGradient>

          <linearGradient id="bench" x1="0" x2="1" y1="0" y2="0">
            <stop stop-color="#8f4d1f" />
            <stop offset="0.26" stop-color="#d8903d" />
            <stop offset="0.68" stop-color="#e8b061" />
            <stop offset="1" stop-color="#8b461a" />
          </linearGradient>

          <linearGradient id="burner-metal" x1="0" x2="1" y1="0" y2="0">
            <stop stop-color="#334155" />
            <stop offset="0.22" stop-color="#e5edf2" />
            <stop offset="0.52" stop-color="#64748b" />
            <stop offset="0.78" stop-color="#f8fafc" />
            <stop offset="1" stop-color="#475569" />
          </linearGradient>

          <linearGradient id="steel" x1="0" x2="1" y1="0" y2="0">
            <stop stop-color="#e2e8f0" />
            <stop offset="0.18" stop-color="#4b5563" />
            <stop offset="0.48" stop-color="#f8fafc" />
            <stop offset="0.74" stop-color="#64748b" />
            <stop offset="1" stop-color="#e5e7eb" />
          </linearGradient>

          <linearGradient id="magnesium-strip" x1="0" x2="1" y1="0" y2="0">
            <stop stop-color="#fff7bd" />
            <stop offset="0.38" stop-color="#a8a779" />
            <stop offset="1" stop-color="#fffde7" />
          </linearGradient>

          <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
            <stop stop-color="#f8fdff" stop-opacity="0.9" />
            <stop offset="0.55" stop-color="#b7dce6" stop-opacity="0.62" />
            <stop offset="1" stop-color="#6f9baa" stop-opacity="0.78" />
          </linearGradient>

          <radialGradient id="flame-glow" cx="50%" cy="55%" r="55%">
            <stop stop-color="#fff7ad" />
            <stop offset="0.36" stop-color="#facc15" stop-opacity="0.78" />
            <stop offset="0.72" stop-color="#fb923c" stop-opacity="0.24" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>

          <radialGradient id="white-burn-glow" cx="50%" cy="50%" r="50%">
            <stop stop-color="#ffffff" />
            <stop offset="0.28" stop-color="#ffffff" />
            <stop offset="0.55" stop-color="#e0f2fe" stop-opacity="0.82" />
            <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
          </radialGradient>

          <filter id="soft-blur" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="10" />
          </filter>

          <filter id="soft-shadow" x="-30%" y="-40%" width="160%" height="180%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.28" />
          </filter>

          <filter id="ash-glow" x="-120%" y="-120%" width="340%" height="340%">
            <feDropShadow dx="0" dy="0" stdDeviation="2.4" flood-color="#ffffff" flood-opacity="0.9" />
          </filter>
        </defs>

        <rect width="1280" height="720" fill="url(#scene-bg)" />
        <path d="M0 532 H1280 V720 H0 Z" fill="url(#bench)" />
        <path d="M0 578 H1280" stroke="#6f3415" stroke-width="3" opacity="0.55" />
        <path d="M0 628 H1280" stroke="#6f3415" stroke-width="2" opacity="0.35" />

        <text class="title" x="44" y="68">Magnesium Ribbon Burning in Air</text>
        <text class="subtitle" x="44" y="99">Physics contract: flame rises vertically; burn, dazzle, and MgO start at the ribbon tip.</text>

        <g id="equation" transform="translate(44 132)">
          <rect width="350" height="102" rx="10" fill="#10294f" stroke="#60a5fa" stroke-width="2" opacity="0.93" />
          <text class="label" x="24" y="34">Chemical reaction</text>
          <text x="24" y="74" font-size="28" font-weight="900">2Mg + O<tspan baseline-shift="sub" font-size="18">2</tspan> -> 2MgO</text>
        </g>

        <g id="burner" filter="url(#soft-shadow)">
          <ellipse cx="496" cy="548" rx="70" ry="21" fill="#1267b3" stroke="#0f3766" stroke-width="4" />
          <path d="M436 548 C462 579 530 579 556 548 Z" fill="#1d7ed0" stroke="#0f3766" stroke-width="4" />
          <path d="M470 454 H522 V548 H470 Z" fill="#bd7b21" stroke="#172554" stroke-width="4" />
          <rect x="491" y="471" width="14" height="22" fill="#1f2937" stroke="#0f172a" stroke-width="3" />

          <path d="M517 456 C570 410 640 375 706 358" fill="none" stroke="url(#burner-metal)" stroke-width="30" stroke-linecap="round" />
          <path d="M517 456 C570 410 640 375 706 358" fill="none" stroke="#172554" stroke-width="4" stroke-linecap="round" />
          <ellipse cx="720" cy="354" rx="25" ry="9" fill="#64748b" stroke="#172554" stroke-width="3" transform="rotate(-16 720 354)" />

          <path d="M470 501 C382 502 296 522 218 540" fill="none" stroke="#b84f13" stroke-width="17" stroke-linecap="round" />
          <path d="M470 501 C382 502 296 522 218 540" fill="none" stroke="#fb6b16" stroke-width="8" stroke-linecap="round" />
        </g>

        <g id="steady-flame" class="screen">
          <ellipse cx="720" cy="313" rx="54" ry="86" fill="url(#flame-glow)" filter="url(#soft-blur)" opacity="0.86" />
          <path d="M690 354 C668 313 699 293 720 260 C741 294 771 314 748 354 C733 374 704 374 690 354 Z" fill="#f59e0b" opacity="0.95" />
          <path d="M704 354 C689 325 708 306 720 281 C733 307 753 326 737 354 C727 368 714 368 704 354 Z" fill="#fff4a3" opacity="0.95" />
        </g>

        <g id="watch-glass" filter="url(#soft-shadow)">
          <ellipse cx="720" cy="585" rx="150" ry="45" fill="url(#glass)" stroke="#dbeafe" stroke-width="3" opacity="0.82" />
          <ellipse cx="720" cy="573" rx="112" ry="21" fill="#ffffff" opacity="0.3" />
          <path d="M589 593 C652 625 788 625 852 593" fill="none" stroke="#8fb3c1" stroke-width="3" opacity="0.8" />
          <g id="mgo-pile" class="will-animate">
            <path d="M649 589 C678 567 760 565 802 589 C764 608 685 608 649 589 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
            <circle cx="687" cy="579" r="4" fill="#ffffff" />
            <circle cx="724" cy="572" r="5" fill="#ffffff" />
            <circle cx="762" cy="581" r="4" fill="#ffffff" />
            <circle cx="708" cy="586" r="3" fill="#ffffff" />
            <circle cx="742" cy="586" r="3.4" fill="#ffffff" />
          </g>
        </g>

        <g id="white-dazzle" class="screen will-animate">
          <circle cx="720" cy="260" r="112" fill="url(#white-burn-glow)" />
          <circle cx="720" cy="260" r="25" fill="#ffffff" />
          <g stroke="#ffffff" stroke-linecap="round" opacity="0.9">
            <line x1="720" y1="260" x2="598" y2="260" stroke-width="4" />
            <line x1="720" y1="260" x2="842" y2="260" stroke-width="4" />
            <line x1="720" y1="260" x2="720" y2="138" stroke-width="4" />
            <line x1="720" y1="260" x2="720" y2="382" stroke-width="4" />
            <line x1="720" y1="260" x2="634" y2="174" stroke-width="3" />
            <line x1="720" y1="260" x2="806" y2="346" stroke-width="3" />
            <line x1="720" y1="260" x2="806" y2="174" stroke-width="3" />
            <line x1="720" y1="260" x2="634" y2="346" stroke-width="3" />
          </g>
        </g>

        <g id="mgo-particles" class="will-animate" filter="url(#ash-glow)">
          <circle class="mgo-particle" style="--fall-x: -6px" cx="720" cy="260" r="4" fill="#ffffff" stroke="#e0f2fe" stroke-width="1" />
          <circle class="mgo-particle" style="--fall-x: -3px" cx="720" cy="260" r="3.2" fill="#ffffff" stroke="#e0f2fe" stroke-width="1" />
          <circle class="mgo-particle" style="--fall-x: 0px" cx="720" cy="260" r="3.6" fill="#ffffff" stroke="#e0f2fe" stroke-width="1" />
          <circle class="mgo-particle" style="--fall-x: 4px" cx="720" cy="260" r="3" fill="#ffffff" stroke="#e0f2fe" stroke-width="1" />
          <circle class="mgo-particle" style="--fall-x: 7px" cx="720" cy="260" r="3.4" fill="#ffffff" stroke="#e0f2fe" stroke-width="1" />
          <circle class="mgo-particle" style="--fall-x: -1px" cx="720" cy="260" r="2.8" fill="#ffffff" stroke="#e0f2fe" stroke-width="1" />
          <circle class="mgo-particle" style="--fall-x: 2px" cx="720" cy="260" r="3" fill="#ffffff" stroke="#e0f2fe" stroke-width="1" />
          <circle class="mgo-particle" style="--fall-x: -5px" cx="720" cy="260" r="2.7" fill="#ffffff" stroke="#e0f2fe" stroke-width="1" />
          <circle class="mgo-particle" style="--fall-x: 5px" cx="720" cy="260" r="2.9" fill="#ffffff" stroke="#e0f2fe" stroke-width="1" />
          <circle class="mgo-particle" style="--fall-x: 1px" cx="720" cy="260" r="3.1" fill="#ffffff" stroke="#e0f2fe" stroke-width="1" />
        </g>

        <g id="tongs-ribbon" class="will-animate">
          <g id="burning-ribbon" class="screen">
            <circle cx="0" cy="0" r="34" fill="url(#white-burn-glow)" />
            <circle cx="0" cy="0" r="10" fill="#ffffff" />
          </g>

          <path d="M0 0 C13 -8 18 -20 10 -32 C25 -28 34 -17 31 -5 C28 7 15 10 0 0 Z" fill="url(#magnesium-strip)" stroke="#73734f" stroke-width="2" />
          <path d="M28 -16 C54 -24 78 -30 104 -39" fill="none" stroke="url(#magnesium-strip)" stroke-width="11" stroke-linecap="round" />
          <path d="M28 -16 C54 -24 78 -30 104 -39" fill="none" stroke="#4b5563" stroke-width="2" stroke-linecap="round" opacity="0.55" />

          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M98 -57 C184 -80 298 -91 430 -84" stroke="url(#steel)" stroke-width="12" />
            <path d="M105 -22 C198 -44 308 -50 438 -40" stroke="url(#steel)" stroke-width="12" />
            <path d="M98 -57 L74 -43 M105 -22 L76 -30" stroke="#cbd5e1" stroke-width="5" />
            <ellipse cx="482" cy="-92" rx="44" ry="22" stroke="#cbd5e1" stroke-width="9" />
            <ellipse cx="497" cy="-40" rx="44" ry="22" stroke="#cbd5e1" stroke-width="9" />
            <path d="M430 -84 C452 -86 466 -90 482 -92" stroke="#cbd5e1" stroke-width="9" />
            <path d="M438 -40 C460 -39 480 -39 497 -40" stroke="#cbd5e1" stroke-width="9" />
          </g>
        </g>

        <g id="labels">
          <text class="label" x="392" y="642">Tilted burner, vertical flame</text>
          <path class="leader" d="M540 616 L720 352" />

          <text class="label" x="870" y="304">Burning Mg ribbon tip</text>
          <path class="leader" d="M858 296 L736 263" />

          <text class="label" x="866" y="430">MgO forms at tip, then collects below</text>
          <path class="leader" d="M850 422 L746 584" />

          <text class="label" x="624" y="668">Watch glass</text>
          <path class="leader" d="M714 642 L724 590" />
        </g>
      </svg>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script>
      function startMagnesiumFigure() {
        if (!window.gsap) {
          document.documentElement.classList.add("no-gsap");
          return;
        }

        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const { gsap } = window;
        const burn = { x: 720, y: 260 };

        gsap.set("#tongs-ribbon", {
          x: 968,
          y: 150,
          rotation: -6,
          transformOrigin: "0px 0px",
        });
        gsap.set("#burning-ribbon", { opacity: 0 });
        gsap.set("#white-dazzle", { opacity: 0 });
        gsap.set("#mgo-particles", { opacity: 0 });
        gsap.set(".mgo-particle", { y: 0, opacity: 0 });
        gsap.set("#mgo-pile", { opacity: 0 });

        if (reduceMotion) {
          gsap.set("#tongs-ribbon", { x: burn.x, y: burn.y, rotation: -2 });
          gsap.set("#burning-ribbon", { opacity: 1 });
          gsap.set("#white-dazzle", { opacity: 0.85 });
          gsap.set("#mgo-pile", { opacity: 1 });
          return;
        }

        const tl = gsap.timeline({
          repeat: -1,
          repeatDelay: 0.7,
          defaults: { ease: "power2.out" },
        });

        tl.addLabel("approach", 0)
          .to(
            "#tongs-ribbon",
            {
              x: burn.x,
              y: burn.y,
              rotation: -2,
              duration: 1.35,
              ease: "power3.inOut",
            },
            "approach"
          )
          .addLabel("ignite", 1.35)
          .to("#burning-ribbon", { opacity: 1, duration: 0.2 }, "ignite")
          .to("#white-dazzle", { opacity: 1, duration: 0.24, ease: "expo.out" }, "ignite+=0.08")
          .to("#white-dazzle", { opacity: 0.72, duration: 0.7, ease: "sine.inOut" }, "ignite+=0.45")
          .addLabel("oxide", 2.2)
          .to("#mgo-particles", { opacity: 1, duration: 0.1 }, "oxide")
          .to(
            ".mgo-particle",
            {
              opacity: 1,
              y: (index) => 286 + (index % 3) * 4,
              x: (index) => [-6, -3, 0, 4, 7, -1, 2, -5, 5, 1][index] || 0,
              duration: 1.36,
              stagger: 0.055,
              ease: "power1.in",
            },
            "oxide+=0.05"
          )
          .to("#mgo-pile", { opacity: 1, duration: 0.45, ease: "power1.out" }, "oxide+=0.95")
          .to("#white-dazzle", { opacity: 0.48, duration: 0.65, ease: "sine.inOut" }, "oxide+=1")
          .addLabel("reset", 4.25)
          .to("#white-dazzle", { opacity: 0, duration: 0.34, ease: "sine.in" }, "reset")
          .to("#burning-ribbon", { opacity: 0, duration: 0.28 }, "reset")
          .to("#mgo-particles", { opacity: 0, duration: 0.24 }, "reset")
          .set(".mgo-particle", { y: 0, x: 0, opacity: 0 }, "reset+=0.24")
          .to("#mgo-pile", { opacity: 0, duration: 0.28, ease: "power1.inOut" }, "reset+=0.1")
          .to(
            "#tongs-ribbon",
            {
              x: 968,
              y: 150,
              rotation: -6,
              duration: 0.78,
              ease: "power2.inOut",
            },
            "reset+=0.08"
          );

        window.__magnesiumRibbonTimeline = tl;
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startMagnesiumFigure);
      } else {
        startMagnesiumFigure();
      }
    </script>
  </body>
</html>
